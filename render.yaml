services:
  - type: web
    name: ecommerce-mern
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1
    envVars:
      # Build/runtime configuration
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NODE_ENV
        value: PRODUCTION
      # react-scripts treats warnings as errors when CI=true
      - key: CI
        value: "false"

      # Secrets — set these in the Render dashboard, not in this file.
      # Do NOT set PORT; Render injects it automatically.
      - key: DB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        sync: false
      - key: COOKIE_EXPIRE
        sync: false

      # Optional — add these in the dashboard when the credentials exist.
      # Without CLOUDINARY_*, product/avatar image upload fails.
      # Without SMPT_*, forgot-password email fails.
      # The rest of the storefront works fine without them.
